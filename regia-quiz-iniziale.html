<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regia — Quiz iniziale — Mirafiori</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { padding: 2rem 1.6rem 4rem; }
  .link-home-regia { display: inline-block; margin-bottom: 1.5rem; color: var(--grigio); font-size: 0.9rem; text-decoration: none; }
  .link-home-regia:hover { color: var(--accento); }
  .testata-regia { max-width: 1200px; margin: 0 auto 1.5rem; display: flex; flex-wrap: wrap; gap: 2rem; align-items: center; justify-content: space-between; }
  .blocco-qr { text-align: center; }
  .blocco-qr #qr-quiz { background: #fff; padding: 1rem; display: inline-block; border-radius: 8px; }
  .contatore-completati {
    max-width: 1200px; margin: 0 auto 2rem; padding: 1.4rem 2rem; background: var(--blu); color: #fff;
    border-radius: 14px; text-align: center;
  }
  .contatore-completati .numero-grande { font-family: var(--font-display); font-size: 2.6rem; font-weight: 900; color: var(--accento); display: block; line-height: 1; }
  .riga-controlli-master { display: flex; gap: 1rem; align-items: center; justify-content: center; margin: 0 auto 2.5rem; max-width: 1200px; flex-wrap: wrap; }
  .griglia-risultati { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
  .card-domanda { background: var(--bianco-2); border-radius: 12px; padding: 1.1rem 1.2rem; }
  .card-domanda h3 { font-size: 0.88rem; margin-bottom: 0.7rem; line-height: 1.3; }
  .barra-risultato-r { margin-bottom: 0.55rem; }
  .etichetta-riga-r { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 0.2rem; }
  .barra-contenitore-r { height: 8px; background: #fff; border: 1px solid var(--linea); border-radius: 4px; overflow: hidden; }
  .barra-riempimento-r { height: 100%; width: 0%; background: var(--blu); transition: width 0.6s ease; }
  .card-checkbox { background: var(--accento); color: #fff; }
  .card-checkbox h3 { color: #fff; }
</style>
</head>
<body>

<a class="link-home-regia" href="index.html">&larr; Torna alla home</a>

<div class="testata-regia">
  <div>
    <p class="grigio" style="margin:0;">Regia — Quiz iniziale</p>
    <h1 style="font-size:2rem; margin:0;">Livello di partenza</h1>
  </div>
  <div class="blocco-qr">
    <div id="qr-quiz" data-url-quiz="https://tobea.it/quiz-iniziale.html"></div>
    <p class="grigio" style="font-size:0.85rem;">Inquadra con i dati mobili</p>
  </div>
</div>

<div class="contatore-completati">
  <span class="numero-grande" id="conteggio-risposte">0</span>
  <span>ragazzi hanno completato il quiz</span>
</div>

<div class="riga-controlli-master">
  <button class="btn" id="btn-apri-quiz">Apri il quiz</button>
  <button class="btn corallo" id="btn-chiudi-quiz">Chiudi il quiz</button>
  <span class="grigio">Stato: <strong id="stato-master">—</strong></span>
</div>

<div class="griglia-risultati" id="griglia-risultati"></div>

<script type="module" src="js/regia-quiz-iniziale.js"></script>
</body>
</html>
