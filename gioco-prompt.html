<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrivi meglio — Mirafiori</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<style>
  body { text-align: left; }
  .gioco { max-width: 560px; margin: 0 auto; padding: 1.2rem 1.1rem 4rem; }

  .pallini { display: flex; gap: 0.45rem; justify-content: center; margin-bottom: 0.5rem; }
  .pallino { width: 10px; height: 10px; border-radius: 50%; background: var(--linea); }
  .pallino.attivo { background: var(--blu); }
  .pallino.fatto { background: var(--accento); }
  .etichetta-avanzamento { display: block; text-align: center; font-size: 0.82rem; color: var(--grigio); margin-bottom: 1.4rem; }

  .titolo-sfida { font-family: var(--font-display); font-size: 1.8rem; color: var(--blu); text-align: center; line-height: 1.15; margin: 0 auto 0.6rem; }
  .obiettivo {
    background: var(--bianco-2); border-left: 4px solid var(--accento); border-radius: 0 12px 12px 0;
    padding: 1rem 1.1rem; font-size: 0.98rem; margin: 0 auto 1.6rem; text-align: left;
  }
  .domanda { font-family: var(--font-display); font-size: 1.25rem; color: var(--blu); text-align: center; line-height: 1.2; margin: 0 auto 1.1rem; max-width: 26ch; }

  /* i prompt sono testo: si leggono come messaggi in una chat */
  .lista-prompt { display: grid; gap: 0.7rem; margin-bottom: 1.4rem; list-style: none; padding: 0; }
  .card-prompt {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--bianco-2); border: 2px solid transparent; border-radius: 14px;
    padding: 0.9rem 1rem; font-family: var(--font-testo); font-size: 0.94rem; line-height: 1.45; color: var(--nero);
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .card-prompt:focus-visible { outline: 3px solid var(--blu-chiaro); outline-offset: 2px; }
  .card-prompt[aria-pressed="true"] { border-color: var(--blu); background: #e8edf7; }
  .card-prompt .etichetta-lettera {
    display: inline-block; width: 1.5rem; height: 1.5rem; line-height: 1.5rem; text-align: center;
    background: #fff; border-radius: 50%; font-weight: 700; font-size: 0.78rem; color: var(--blu);
    margin-right: 0.5rem; flex: none;
  }
  .card-prompt[aria-pressed="true"] .etichetta-lettera { background: var(--blu); color: #fff; }

  /* schermata con le risposte */
  .blocco-risposta { background: var(--bianco-2); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 0.9rem; text-align: left; }
  .blocco-risposta.tua { border: 2px solid var(--blu); }
  .intestazione-risposta { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
  .tag-tuo { background: var(--blu); color: #fff; font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 999px; letter-spacing: 0.04em; }
  .testo-prompt { font-size: 0.88rem; color: var(--blu); font-weight: 600; line-height: 1.4; }
  .testo-risposta {
    background: #fff; border-radius: 10px; padding: 0.75rem 0.85rem; font-size: 0.86rem;
    line-height: 1.5; white-space: pre-line; color: var(--nero); margin-bottom: 0.6rem;
  }
  .commento { font-size: 0.85rem; color: var(--grigio); font-style: italic; }

  .btn-azione { display: block; width: 100%; padding: 1rem; font-family: var(--font-testo); font-weight: 700; font-size: 1.05rem; background: var(--blu); color: #fff; border: none; border-radius: 999px; cursor: pointer; }
  .btn-azione:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-azione:focus-visible { outline: 3px solid var(--blu-chiaro); outline-offset: 3px; }

  .debrief { text-align: center; padding: 3rem 1rem; }
  .debrief p { font-family: var(--font-display); font-size: 1.45rem; color: var(--blu); line-height: 1.25; margin: 0 auto 2rem; max-width: 26ch; }

  .schermo { text-align: center; padding: 3rem 1.1rem; }
  .schermo p { font-size: 1.05rem; margin: 0 auto 0.9rem; max-width: 34ch; }
  .titolo-finale { font-family: var(--font-display); font-size: clamp(2.2rem, 12vw, 3.4rem); color: var(--blu); line-height: 1.05; margin-bottom: 1.4rem; }
  .scala { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; list-style: none; padding: 0; }
  .voto { padding: 0.9rem 0; font-family: var(--font-testo); font-weight: 700; font-size: 1rem; background: var(--bianco-2); color: var(--blu); border: 2px solid transparent; border-radius: 12px; cursor: pointer; width: 100%; }
  .voto[aria-pressed="true"] { background: var(--blu); color: #fff; }
  .voto:focus-visible { outline: 3px solid var(--blu-chiaro); outline-offset: 2px; }

  .avviso { background: #fff4f4; border: 1px solid #f3c7cb; color: #8a2733; padding: 1rem 1.2rem; border-radius: 12px; font-size: 0.95rem; }
  .nascosto { display: none; }

  .anim-entrata { animation: entrata 500ms ease both; }
  @keyframes entrata { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .anim-entrata { animation: none; } .card-prompt { transition: none; } }
</style>
</head>
<body>
<header id="barra" data-modo="gioco" data-avviso="Le risposte già date restano salvate."></header>
<script src="js/nav.js"></script>

<div class="gioco">

  <div id="schermo-stato" class="schermo" role="status" aria-live="polite">
    <h1 id="stato-titolo">Un attimo…</h1>
    <p id="stato-testo" class="grigio">Sto caricando l'attività.</p>
  </div>

  <main id="schermo-gioco" class="nascosto">
    <div class="pallini" id="pallini" role="presentation"></div>
    <span class="etichetta-avanzamento" id="etichetta-avanzamento">Sfida 1 di 5</span>

    <!-- FASE 1: scelta al buio -->
    <section id="fase-prima" class="nascosto">
      <h1 class="titolo-sfida" id="titolo-sfida"></h1>
      <p class="obiettivo" id="obiettivo"></p>
      <p class="domanda" id="domanda-prima"></p>
      <ul class="lista-prompt" id="lista-prima" role="group" aria-label="Scegli un prompt"></ul>
      <button type="button" class="btn-azione" id="btn-prima" disabled>Conferma</button>
      <p class="grigio" style="text-align:center; font-size:0.85rem; margin-top:0.9rem;">Vai d'istinto: nessuna risposta è sbagliata.</p>
    </section>

    <!-- FASE 2: risposte reali -->
    <section id="fase-risposte" class="nascosto">
      <p class="domanda" id="testo-rivela"></p>
      <div id="contenitore-risposte"></div>
      <p class="domanda" id="domanda-dopo"></p>
      <ul class="lista-prompt" id="lista-dopo" role="group" aria-label="Scegli di nuovo"></ul>
      <button type="button" class="btn-azione" id="btn-dopo" disabled>Conferma</button>
    </section>

    <!-- FASE 3: micro-debrief -->
    <section id="fase-debrief" class="debrief nascosto">
      <p id="testo-debrief"></p>
      <button type="button" class="btn-azione" id="btn-continua">Continua</button>
    </section>
  </main>

  <div id="schermo-fine" class="schermo nascosto">
    <p class="titolo-finale">Scrivi meglio</p>
    <div id="fine-testo"></div>
    <div id="blocco-riflessione" style="margin-top:2rem;">
      <p class="domanda" id="domanda-riflessione"></p>
      <ul class="scala" id="opzioni-riflessione" role="group" aria-label="Risposta finale"></ul>
    </div>
    <p class="grigio" style="margin-top:2rem; font-size:0.9rem;">Puoi appoggiare il telefono. Si continua insieme.</p>
  </div>

</div>

<script type="module" src="js/prompt-studente.js"></script>
</body>
</html>
