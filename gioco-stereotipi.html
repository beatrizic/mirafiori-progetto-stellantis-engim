<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Che lavoro fa? — Mirafiori</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="css/style.css">
<style>
  body { text-align: left; }
  .gioco { max-width: 520px; margin: 0 auto; padding: 1.4rem 1.2rem 4rem; }

  .barra-avanzamento { margin-bottom: 1.2rem; }
  .barra-avanzamento .etichetta { font-size: 0.85rem; color: var(--grigio); text-align: center; display: block; margin-bottom: 0.4rem; }
  .barra-avanzamento .traccia { height: 6px; background: var(--bianco-2); border-radius: 3px; overflow: hidden; }
  .barra-avanzamento .riempimento { height: 100%; background: var(--blu); width: 0%; transition: width 0.3s ease; }

  .ritratto {
    width: 100%; max-width: 320px; aspect-ratio: 1 / 1; object-fit: cover;
    border-radius: 18px; margin: 0 auto 1.4rem; background: var(--bianco-2);
    box-shadow: 0 8px 24px rgba(14,42,82,0.12);
  }

  .domanda-testo {
    font-family: var(--font-display); font-size: 1.4rem; line-height: 1.2;
    color: var(--blu); text-align: center; margin: 0 auto 1.4rem; max-width: 22ch;
  }

  .opzioni { display: grid; gap: 0.7rem; margin-bottom: 1.4rem; list-style: none; padding: 0; }
  .opzione {
    display: block; width: 100%; text-align: left;
    padding: 1rem 1.1rem; font-family: var(--font-testo); font-size: 1rem;
    background: var(--bianco-2); color: var(--nero);
    border: 2px solid transparent; border-radius: 12px; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .opzione:hover { border-color: var(--linea); }
  .opzione:focus-visible { outline: 3px solid var(--blu-chiaro); outline-offset: 2px; }
  .opzione[aria-pressed="true"] {
    border-color: var(--blu); background: #e8edf7; font-weight: 600;
  }
  .opzione[aria-pressed="true"]::before { content: '\2713\00a0\00a0'; color: var(--blu); font-weight: 700; }

  .btn-conferma {
    display: block; width: 100%; padding: 1rem;
    font-family: var(--font-testo); font-weight: 700; font-size: 1.05rem;
    background: var(--blu); color: #fff; border: none; border-radius: 999px; cursor: pointer;
  }
  .btn-conferma:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-conferma:focus-visible { outline: 3px solid var(--blu-chiaro); outline-offset: 3px; }

  .schermo { text-align: center; padding: 3.5rem 1.2rem; }
  .schermo h1 { font-size: clamp(2rem, 9vw, 3rem); }
  .schermo p { font-size: 1.05rem; margin: 0 auto 1rem; max-width: 34ch; }
  .schermo .rilievo { color: var(--blu); font-weight: 600; }

  .profilo-retribuzione {
    background: var(--bianco-2); border-radius: 16px; padding: 1.6rem; margin-bottom: 1.4rem;
    text-align: center;
  }
  .profilo-retribuzione .nome {
    font-family: var(--font-display); font-size: 1.8rem; color: var(--blu); display: block; margin-bottom: 0.6rem;
  }
  .profilo-retribuzione ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.3rem; }
  .profilo-retribuzione li { font-size: 0.98rem; color: var(--nero); }

  .avviso { background: #fff4f4; border: 1px solid #f3c7cb; color: #8a2733; padding: 1rem 1.2rem; border-radius: 12px; font-size: 0.95rem; }
  .nascosto { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .barra-avanzamento .riempimento { transition: none; }
    .opzione { transition: none; }
  }
</style>
</head>
<body>
<header id="barra" data-modo="gioco" data-avviso="Le risposte già date restano salvate."></header>
<script src="js/nav.js"></script>

<div class="gioco">

  <!-- stati non giocabili -->
  <div id="schermo-stato" class="schermo" role="status" aria-live="polite">
    <h1 id="stato-titolo">Un attimo…</h1>
    <p id="stato-testo" class="grigio">Sto caricando l'attività.</p>
  </div>

  <!-- quiz professioni -->
  <main id="schermo-quiz" class="nascosto">
    <div class="barra-avanzamento">
      <span class="etichetta" id="avanzamento-testo">1 / 6</span>
      <div class="traccia" role="progressbar" aria-labelledby="avanzamento-testo" aria-valuemin="0" aria-valuemax="6" aria-valuenow="1">
        <div class="riempimento" id="avanzamento-riempimento"></div>
      </div>
    </div>

    <img id="ritratto" class="ritratto" src="" alt="">

    <h1 class="domanda-testo">Secondo te, che lavoro fa questa persona?</h1>

    <ul class="opzioni" id="opzioni" role="group" aria-label="Scegli una professione"></ul>

    <button type="button" class="btn-conferma" id="btn-conferma" disabled>Conferma</button>
    <p class="grigio" style="text-align:center; font-size:0.85rem; margin-top:1rem;">Vai con la prima impressione.</p>
  </main>

  <!-- test retribuzione -->
  <main id="schermo-retribuzione" class="nascosto">
    <div class="profilo-retribuzione">
      <span class="nome" id="retr-nome"></span>
      <ul id="retr-dettagli"></ul>
    </div>
    <h1 class="domanda-testo">Secondo te, quale sarebbe uno stipendio mensile netto adeguato per questa persona?</h1>
    <ul class="opzioni" id="retr-opzioni" role="group" aria-label="Scegli una fascia di stipendio"></ul>
    <button type="button" class="btn-conferma" id="retr-conferma" disabled>Conferma</button>
  </main>

  <!-- schermata finale -->
  <div id="schermo-fine" class="schermo nascosto">
    <h1>Fine</h1>
    <div id="fine-testo"></div>
    <div id="fine-domanda" style="margin-top:1.6rem;"></div>
    <p class="grigio" style="margin-top:2rem; font-size:0.9rem;">Puoi appoggiare il telefono. Si continua insieme.</p>
  </div>

</div>

<script type="module" src="js/stereotipi-studente.js"></script>
</body>
</html>
